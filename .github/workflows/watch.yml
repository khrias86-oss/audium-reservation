name: 🔔 오디움 빈자리 감시

# 폴링 예산에 대해:
#
# private 저장소의 무료 Actions 시간은 월 2,000분이고 실행 1회는 최소 1분으로
# 반올림된다. 10분 간격 상시 폴링은 월 4,320분이라 한도를 넘는다.
#
# 그래서 한국 활동 시간대(07~23시 KST = 22~14시 UTC)에만 돌리고, 감시 대상이
# 없으면 워커가 수 초 만에 스스로 끝낸다. 오디움은 목·금·토만 운영하고 취소표는
# 관람 1~2일 전과 당일 오전에 몰리므로, 이 방식은 예산을 아끼면서 동시에
# 잡을 확률이 높은 구간에 자원을 집중한다.
on:
  schedule:
    - cron: '*/10 22-23,0-14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제 예약 없이 확인만 (권장)'
        type: boolean
        default: true

concurrency:
  # 이전 실행이 끝나기 전에 다음 실행이 겹치면 중복 예약 위험이 생긴다.
  group: audeum-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # 빈자리를 찾으면 이슈로 알린다

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: 감시할 항목이 있는지 먼저 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 감시 요청은 watch-request 라벨이 붙은 열린 이슈다.
          # 하나도 없으면 브라우저를 설치하지 않고 여기서 끝낸다 — 실행 시간을 아낀다.
          count=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=watch-request&per_page=100" \
            | grep -c '"number"' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "감시 요청 $count건"

      - name: Playwright 브라우저 설치
        if: steps.check.outputs.count != '0'
        run: npx playwright install --with-deps chromium

      - name: 빈자리 확인
        if: steps.check.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 기본은 확인만. 실제 예약은 명시적으로 켤 때만 동작한다.
          DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
        run: npx tsx src/watch-once.ts

      - name: 감시 요청이 없을 때
        if: steps.check.outputs.count == '0'
        run: echo "감시 중인 항목이 없습니다. 이슈로 '빈자리 감시 신청'을 등록하세요." >> "$GITHUB_STEP_SUMMARY"
