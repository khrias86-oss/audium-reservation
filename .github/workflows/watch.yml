name: 🔔 오디움 빈자리 감시

# ## 폴링 예산 — 저장소가 public이 되면서 사라졌다
#
# private일 때는 월 2,000분 한도가 모든 것을 결정했다. 실행 1회는 몇 초가 걸리든
# 1분으로 반올림되므로 비용을 정하는 것은 횟수였고, 그래서 수~토 낮으로 좁혀
# 월 약 1,370분에 맞춰 두었다.
#
# **public 저장소의 Actions는 무제한 무료다.** 그 제약이 통째로 없어졌으므로
# 이제는 "예산에 맞춰 몇 번 볼 수 있나"가 아니라 "몇 번 보는 것이 옳은가"를
# 기준으로 정한다.
#
# ## 지금 시간표: 화~토 24시간, 5분 간격
#
# - **5분**은 이 프로젝트가 정한 하한이다 (`src/core/scheduler.ts`, CLAUDE.md).
#   사이트에 부담을 주지 않기 위한 선이라 예산이 없어져도 내리지 않는다.
#   확인 1회가 폼 POST 한 건이므로 5분에 1회는 어떤 서버에도 가벼운 부하다.
# - **화~토**만 도는 이유: 전시는 목·금·토에만 열리고, 예약은 격주 화요일 14시에
#   오픈된다. 일·월은 관람일도 오픈일도 아니라 취소표가 거의 나오지 않는다.
# - **24시간**으로 넓힌 이유: 취소는 사람이 하는 일이라 시간대를 가리지 않는다.
#   예산이 있을 때는 확률이 높은 구간에 몰아줄 수밖에 없었지만, 이제는 그럴
#   이유가 없다. 새벽에 나온 자리도 잡는다.
#
# 부수 효과가 하나 더 있다. 슬롯이 하루 78개에서 288개로 늘면서 **스케줄 지연에
# 강해진다.** GitHub은 예약 실행을 부하에 따라 늦추거나 건너뛰는데, 기회가 많으면
# 몇 번 밀려도 곧 다음 기회가 온다.
#
# 분을 0, 5, 10…이 아니라 2, 7, 12…로 둔 것은 매시 정각의 혼잡을 피하기 위해서다.
# GitHub 문서: "The schedule event can be delayed during periods of high loads...
# High load times include the start of every hour."
on:
  schedule:
    # 화~토 24시간, 5분 간격. UTC 기준 화요일 00:02는 KST 화요일 09:02이고,
    # UTC 토요일 23:57은 KST 일요일 08:57이다. KST로 보면 화요일 오전부터
    # 일요일 새벽까지 이어지는 셈이라, 목·금·토 관람일 전후를 모두 덮는다.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * 2-6'
  # watch-run 브랜치 푸시는 시험 실행용이다. workflow_dispatch는 워크플로가 기본
  # 브랜치에 있어야만 동작하는데, 이 워크플로는 아직 병합 전이라 쓸 수 없다.
  # 병합 후에는 이 트리거를 지워도 된다.
  push:
    branches: [watch-run]
  workflow_dispatch:
    inputs:
      confirm_live_booking:
        description: '⚠️ 실제로 예약합니다 (체크하지 않으면 확인만 합니다)'
        type: boolean
        default: false

concurrency:
  # 이전 실행이 끝나기 전에 다음 실행이 겹치면 중복 예약 위험이 생긴다.
  group: audeum-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # 빈자리를 찾으면 이슈로 알린다

jobs:
  watch:
    runs-on: ubuntu-latest
    # 폭주 시 청구를 막는 상한. 브라우저를 걷어낸 뒤 실제 실행은 30초 안팎이므로
    # 5분이면 넉넉하고, 무언가 매달려도 5분에서 끊긴다.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      # 브라우저는 더 이상 필요 없다 (11차 정찰). 조회는 폼 POST 한 건이므로
      # 실행에 필요한 것은 tsx·cheerio·zod뿐이고, 설치가 몇 초로 끝난다.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 감시할 항목이 있는지 먼저 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 신청서는 본문에 "### 관람 희망 날짜"가 있는 열린 이슈다.
          #
          # 예전에는 watch-request 라벨로 셌는데, 폰에서 낸 신청서에는 그 라벨이
          # 붙지 않는다 — 신청 링크가 ?labels=를 담아 보내도 GitHub 모바일 웹이
          # 조용히 버린다. 그래서 실제 신청이 있는데도 0으로 세고 그냥 끝냈다.
          # 하나도 없을 때만 건너뛰면 되므로, 판별은 넉넉한 쪽이 안전하다.
          count=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&per_page=100" \
            | grep -c '관람 희망 날짜' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "감시 요청 $count건"

      - name: 빈자리 확인
        if: steps.check.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 위험한 쪽(실제 예약)은 **명시적으로 참일 때만** 선택되게 한다.
          #
          # 이전 표현식은 `inputs.dry_run == false`였는데, push로 실행되면
          # inputs가 비어 있고 GitHub 표현식에서 null == false 가 참이 되어
          # 실제 예약 모드로 켜졌다. 첫 시험 운전이 실제로 그렇게 돌았다.
          # 없는 값·모르는 값은 전부 안전한 쪽으로 떨어져야 한다.
          DRY_RUN: ${{ inputs.confirm_live_booking == true && 'false' || 'true' }}
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
        run: npx tsx src/watch-once.ts

      - name: 감시 요청이 없을 때
        if: steps.check.outputs.count == '0'
        run: echo "감시 중인 항목이 없습니다. 이슈로 '빈자리 감시 신청'을 등록하세요." >> "$GITHUB_STEP_SUMMARY"
