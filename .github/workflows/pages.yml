name: 📄 감시 신청 페이지 배포

# `docs-site/index.html` 을 GitHub Pages로 올린다.
#
# ## 왜 "브랜치에서 배포"가 아니라 Actions인가
#
# 브랜치 배포는 루트나 `/docs` 두 곳만 고를 수 있다. 이 저장소의 `docs/` 는 이미
# 설계 문서가 쓰고 있고, 페이지는 `docs-site/` 에 있다. 문서를 옮기거나 섞는 대신
# Actions로 올리면 폴더 제약이 없다.
#
# ## Pages는 한 번 사람이 켜야 한다
#
# 처음에 `enablement: true`로 자동 활성화를 시도했다가 실패했다.
#
#     Create Pages site failed. Error: Resource not accessible by integration
#
# Actions의 기본 토큰(`GITHUB_TOKEN`)에 주는 `pages: write`는 **이미 켜진 Pages에
# 배포할** 권한이지 **Pages 사이트를 만들** 권한이 아니다. 저장소 설정을 바꾸는
# 일이라 봇에게 열어두지 않는 것이고, 그 자체는 합리적인 선이다.
#
# 그래서 한 번만 사람이 켠다:
#
#     Settings → Pages → Build and deployment → Source: **GitHub Actions**
#
# 그 뒤로는 `docs-site/` 가 바뀔 때마다 이 워크플로가 알아서 배포한다.
on:
  push:
    branches: [main]
    paths: ['docs-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 되지만, 새 배포가 있으면 진행 중인 것은 버려도 된다.
# 마지막 것만 살아남으면 되는 종류의 작업이다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages 설정
        id: pages
        # 실패해도 워크플로를 여기서 끝내지 않는다. 아래에서 무엇을 해야 하는지
        # 사람에게 알려주는 편이, 로그 깊숙한 곳의 권한 오류보다 낫다.
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages가 꺼져 있으면 무엇을 해야 하는지 알린다
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ GitHub Pages가 아직 켜져 있지 않습니다"
            echo ""
            echo "저장소 설정에서 **한 번만** 켜주시면 그 뒤로는 자동입니다."
            echo ""
            echo "1. **Settings → Pages** 로 이동"
            echo "2. **Build and deployment → Source** 를 **GitHub Actions** 로 변경"
            echo "3. 이 워크플로를 다시 실행 (Actions 탭 → 이 워크플로 → Run workflow)"
            echo ""
            echo "Actions의 기본 토큰에는 Pages 사이트를 *만들* 권한이 없습니다."
            echo "(있는 것은 이미 켜진 Pages에 *배포할* 권한뿐입니다.)"
            echo "저장소 설정을 바꾸는 일이라 봇에게 열어두지 않는 것이고, 합리적인 선입니다."
            echo ""
            echo "그동안에도 감시 신청 페이지는 아래 주소로 쓸 수 있습니다:"
            echo "https://claude.ai/code/artifact/1af3e850-4a59-4c2d-8501-39bb6548f72a"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pages가 꺼져 있습니다. 위 안내대로 한 번만 켜주세요."
          exit 1

      - name: 페이지 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

      - name: 배포
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 주소 알리기
        run: |
          echo "### 감시 신청 페이지" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
