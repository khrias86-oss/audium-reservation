name: M1 정찰 (오디움 사이트 구조 조사)

# 두 가지 방식으로 실행할 수 있다.
#
# 1) workflow_dispatch — 수동 버튼/API. 단, GitHub는 워크플로 파일이 기본 브랜치에
#    있을 때만 이 방식을 허용한다.
# 2) push (recon-run 브랜치 전용) — 이 브랜치에 푸시하는 것 자체가 실행 신호다.
#    기본 브랜치 병합 없이도 돌릴 수 있어, PC 없이 지시만으로 정찰이 가능하다.
#
# recon-run은 오직 이 목적으로만 쓰는 전용 브랜치다. 일반 개발 브랜치에 푸시해도
# 실행되지 않으므로, 여전히 "명시적으로 실행시킬 때만 도는" 성질은 유지된다.
# 스케줄 트리거는 두지 않는다 — 정찰은 1회성 조사이지 반복 폴링이 아니다(§0.5).
on:
  workflow_dispatch: {}
  push:
    branches: [recon-run]

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 정찰은 5분 내외로 끝나야 정상이다. 걸리면 뭔가 잘못된 것.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 정찰 실행
        run: node scripts/recon-audeum.mjs
        # 실패해도 아티팩트와 로그는 남긴다 — 어디서 막혔는지 아는 것 자체가 정보다.
        continue-on-error: true

      - name: 리포트를 로그에 출력
        if: always()
        # 아티팩트는 zip이라 원격에서 읽기 번거롭다. 리포트 전문을 로그에도 남겨
        # Actions API만으로 결과를 확인할 수 있게 한다.
        run: |
          echo "=============== RECON REPORT BEGIN ==============="
          cat recon-output/RECON_REPORT.md || echo "리포트 파일이 생성되지 않았습니다"
          echo "=============== RECON REPORT END ================="

      - name: 리포트를 잡 서머리에 표시
        if: always()
        run: cat recon-output/RECON_REPORT.md >> "$GITHUB_STEP_SUMMARY" || echo "리포트 없음"

      - name: 정찰 산출물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-output
          path: recon-output/
          retention-days: 14
