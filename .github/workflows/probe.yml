name: 🔍 결제 단계 계약 정찰 (HTTP 전용)

# 브라우저를 쓰지 않으므로 크로미움 설치가 없다. 실행이 20초 안에 끝난다.
#
# 스케줄은 걸지 않는다. `probe-run` 브랜치에 푸시할 때만 돈다.
# (workflow_dispatch는 워크플로가 기본 브랜치에 있어야 동작한다.)
on:
  push:
    branches: [probe-run, probe-payment-run]
  workflow_dispatch:
    inputs:
      probe_payment_form:
        description: '결제 화면 조각까지 읽습니다 (예약은 제출하지 않습니다)'
        type: boolean
        default: false
      reserve_seq:
        description: '결제 화면을 읽을 회차의 seq_reserve 값'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 위험한 쪽은 명시적으로 참일 때만 켜진다. 값이 없거나 모르는 값이면
      # 전부 꺼진 쪽으로 떨어진다.
      # probe-payment-run 브랜치로 밀면 결제 화면까지 읽는다. 그 브랜치에
      # 미는 행위 자체가 명시적 동의다. 제출은 어느 경우에도 하지 않는다.
      PROBE_PAYMENT_FORM: ${{ (inputs.probe_payment_form == true || github.ref_name == 'probe-payment-run') && '1' || '0' }}
      PROBE_RESERVE_SEQ: ${{ inputs.reserve_seq }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 정찰 실행 (HTTP)
        run: node scripts/recon-payment.mjs

      - name: HTTP 리포트 출력
        if: always()
        run: |
          cat recon-output/RECON_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
          mv recon-output/RECON_REPORT.md recon-output/RECON_HTTP.md || true

      # 결제 화면은 HTTP만으로는 500이다. 앞 단계에서 고른 인원이 서버 세션에
      # 있어야 그려지는 것으로 보인다. 그 세션을 만드는 정직한 방법은 사람이
      # 하는 대로 걸어가는 것뿐이라, 이 단계에서만 브라우저를 쓴다.
      # 예약 버튼과 인증번호 발송 버튼은 누르지 않는다.
      - name: 브라우저 준비 (결제 화면 확인용)
        if: env.PROBE_PAYMENT_FORM == '1'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium

      - name: 결제 화면 확인 (제출 없음)
        if: env.PROBE_PAYMENT_FORM == '1'
        run: node scripts/recon-payment-browser.mjs

      - name: 리포트를 로그와 서머리에 출력
        if: always()
        run: |
          for f in recon-output/RECON_HTTP.md recon-output/RECON_REPORT.md; do
            [ -f "$f" ] || continue
            echo "=============== $f START ==============="
            cat "$f"
            echo "=============== $f END ================="
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-output
          path: recon-output/
          retention-days: 14
